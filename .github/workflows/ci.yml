name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default; CodeQL elevates its own job separately.
permissions:
  contents: read

# A newer push to the same ref cancels in-flight runs (saves Actions minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (guard · typecheck · lint · format · test · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9 # version is read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-0003: the deterministic core must stay dependency-free.
      - name: Guard — @skervik/core has zero runtime deps
        run: pnpm run check:core-deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      # The gates below import workspace `dist/`, which is gitignored and is not
      # produced by install — so Build must run before the first gate for the
      # named gates to have clean-checkout evidence (m2-gate-11).
      - name: Build
        run: pnpm build

      # Architectural invariant #1 (ADR-0003): the core must stay deterministic.
      # Run the golden-replay determinism/fair-RNG-audit test as its own named
      # gate so a regression reads as "core determinism broken" in the PR checks
      # — not as a nameless failure buried in the general test run below. The
      # full `pnpm test` step still re-runs it; the duplication is intentional.
      - name: Core determinism gate — golden replay → byte-identical state
        run: pnpm --filter @skervik/core exec vitest run src/replay.test.ts

      # M1 headline gate (S1.7.2, A2 discipline): boot the real server, drive a
      # full Classic match cross-process over N real @colyseus/sdk clients, and
      # assert determinism + event-log replay-equality + seed secrecy. Named as
      # its own step so breaking match flow or log fidelity fails EXACTLY this
      # gate (e.g. a corrupted persisted event breaks the replay-equality assert)
      # rather than reading as a nameless failure in the general test run. The
      # full `pnpm test` step still re-runs it; the duplication is intentional.
      #
      # m2-gate-01 widens this gate from Classic alone to EVERY shipping
      # profile: the M2 mode platform promises "Classic/Balanced/Blitz all
      # playable + seed-verifiable", so each profile's full-match e2e is listed
      # explicitly here. A mode that stops reaching a winner must fail this
      # named gate, not hide inside the general test run.
      - name: E2E full-match gate — per-profile match + replay-equality
        run: >-
          pnpm --filter @skervik/server exec vitest run
          src/e2e/fullMatch.e2e.test.ts
          src/e2e/twoPlayerMatch.e2e.test.ts
          src/e2e/balancedMatch.e2e.test.ts
          src/e2e/blitzMatch.e2e.test.ts
          src/e2e/expandedMatch.e2e.test.ts
          src/e2e/expandedMultiClient.e2e.test.ts

      # M1-gate closer (S1.7.3, A2 discipline): the provably-fair «Честный жребий»
      # proof. `verifyMatchRandomness` recomputes every seed-derived draw (dice,
      # steal, dev-card, board) from the revealed seed and the endpoint ties that
      # to the SHA-256 commitment. Named as its own step so tampering with the
      # fairness math, the reveal, or a persisted draw fails EXACTLY this gate.
      # The full `pnpm test` step re-runs it; the duplication is intentional.
      - name: Fairness verify gate — recompute rolls vs revealed seed + commitment
        run: pnpm --filter @skervik/core exec vitest run src/verify.test.ts && pnpm --filter @skervik/server exec vitest run src/routes/matchVerify.test.ts

      - name: Test
        run: pnpm test
